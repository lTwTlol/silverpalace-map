<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白银之城 · 标记工具</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ===== 顶部工具栏 ===== */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 56px;
            background: rgba(26, 26, 46, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
            color: #eee;
            flex-shrink: 0;
            overflow-x: auto;
        }
        .toolbar .brand {
            font-weight: 700;
            font-size: 18px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            margin-right: 8px;
            white-space: nowrap;
        }
        .toolbar .sep {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }
        .toolbar .btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #ddd;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .toolbar .btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }
        .toolbar .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .toolbar .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        .toolbar .btn-success {
            background: linear-gradient(135deg, #34d399, #059669);
            color: #fff;
        }
        .toolbar .btn-success:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.4);
        }
        .toolbar .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }
        .toolbar .btn-warning:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        }
        .toolbar .zoom-info {
            font-size: 13px;
            color: #aaa;
            min-width: 60px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .toolbar .spacer {
            flex: 1;
            min-width: 10px;
        }
        .toolbar .file-input-wrap {
            position: relative;
            overflow: hidden;
            display: inline-block;
            flex-shrink: 0;
        }
        .toolbar .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* ===== 地图选择器 ===== */
        .map-selector-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .map-selector-wrap select {
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.4);
            color: #eee;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            max-width: 160px;
            font-family: inherit;
        }
        .map-selector-wrap select:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }
        .map-selector-wrap select option {
            background: #1a1a2e;
            color: #eee;
        }
        .map-selector-wrap .map-count {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        /* ===== 地图容器 ===== */
        #map-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0f0f1a;
            overflow: hidden;
            cursor: grab;
        }
        #map-container.grabbing {
            cursor: grabbing;
        }

        /* ===== 地图图层 ===== */
        #map-layer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
        }
        #map-layer img {
            display: block;
            width: auto;
            height: auto;
            pointer-events: none;
            image-rendering: auto;
        }

        /* ===== 标记容器 ===== */
        #marker-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .marker {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: filter 0.15s;
            z-index: 10;
            will-change: transform;
            transform: translate(-50%, -50%);
        }
        .marker:active {
            cursor: grabbing;
        }
        .marker:hover {
            filter: brightness(1.2) drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
            z-index: 20;
        }
        /* 已找到状态：半透明 + 右上角对勾 */
        .marker.found .icon-wrap {
            opacity: 0.5;
            filter: grayscale(0.3);
        }
        .marker.found .check-badge {
            display: flex;
        }
        .marker .icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }
        .marker .icon-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .marker .icon-wrap .emoji {
            font-size: inherit;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
        }
        /* 右上角对勾 ✓ */
        .marker .check-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: #22c55e;
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
            line-height: 1;
        }
        .marker .label-text {
            margin-top: 4px;
            font-size: 11px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.45);
            padding: 1px 8px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 0.3px;
            pointer-events: none;
        }
        .marker .label-text.hidden {
            display: none;
        }

        /* ===== 右键菜单 ===== */
        #context-menu {
            position: fixed;
            z-index: 999;
            background: rgba(30, 30, 50, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            padding: 6px 0;
            min-width: 170px;
            display: none;
            overflow: hidden;
            animation: menuFade 0.15s ease;
        }
        @keyframes menuFade {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(-6px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        #context-menu .menu-item {
            padding: 10px 22px;
            color: #e8e8f0;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.12s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-weight: 450;
        }
        #context-menu .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        #context-menu .menu-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        #context-menu .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 4px 12px;
        }

        /* ===== 编辑面板 ===== */
        #edit-panel {
            position: fixed;
            z-index: 500;
            background: rgba(24, 24, 42, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            padding: 28px 30px 30px;
            min-width: 340px;
            max-width: 420px;
            display: none;
            animation: panelSlide 0.2s ease;
            color: #eee;
        }
        @keyframes panelSlide {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        #edit-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #edit-panel .panel-header h3 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #edit-panel .panel-close {
            background: none;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
            line-height: 1;
        }
        #edit-panel .panel-close:hover {
            color: #fff;
        }
        #edit-panel .field {
            margin-bottom: 16px;
        }
        #edit-panel .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        #edit-panel .field .icon-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        #edit-panel .field .icon-option {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-size: 24px;
            padding: 4px;
        }
        #edit-panel .field .icon-option:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }
        #edit-panel .field .icon-option.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }
        #edit-panel .field .icon-option img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }
        #edit-panel .field .icon-option .emoji {
            font-size: 26px;
            line-height: 1;
        }
        #edit-panel .field input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            color: #eee;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
            font-family: inherit;
        }
        #edit-panel .field input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* ===== 备注富文本编辑器 ===== */
        #editNote {
            width: 100%;
            min-height: 120px;
            max-height: 300px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            color: #eee;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
            font-family: inherit;
            resize: vertical;
            overflow-y: auto;
            line-height: 1.6;
            cursor: text;
        }
        #editNote:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        #editNote:empty::before {
            content: "输入备注信息…";
            color: #666;
        }
        #editNote img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin: 4px 0;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #editNote .note-img-wrap {
            display: block;
            margin: 6px 0;
            position: relative;
        }
        #editNote .note-img-wrap img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #editNote .note-img-wrap .img-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #editNote .note-img-wrap:hover .img-delete {
            opacity: 1;
        }
        #editNote .note-img-wrap .img-delete:hover {
            background: rgba(248, 113, 113, 0.8);
        }

        #edit-panel .field .size-control {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        #edit-panel .field .size-control input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 4px;
            outline: none;
        }
        #edit-panel .field .size-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        #edit-panel .field .size-control .size-value {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #ccc;
            font-size: 15px;
        }
        #edit-panel .panel-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            gap: 8px;
        }
        #edit-panel .panel-actions button {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        #edit-panel .panel-actions .btn-delete {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
        #edit-panel .panel-actions .btn-delete:hover {
            background: rgba(248, 113, 113, 0.25);
        }
        #edit-panel .panel-actions .btn-found {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }
        #edit-panel .panel-actions .btn-found:hover {
            background: rgba(34, 197, 94, 0.25);
        }
        #edit-panel .panel-actions .btn-found.active {
            background: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* ===== 空状态提示 ===== */
        .empty-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 20px;
            text-align: center;
            pointer-events: none;
            line-height: 1.8;
            z-index: 0;
            display: none;
        }
        .empty-hint.show {
            display: block;
        }
        .empty-hint .big {
            font-size: 52px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.6;
        }
        .empty-hint .sub {
            font-size: 14px;
            opacity: 0.4;
        }

        /* ===== 提示信息 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(12px);
            color: #eee;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .toolbar {
                padding: 0 12px;
                gap: 6px;
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .toolbar .brand {
                font-size: 14px;
                margin-right: 4px;
            }
            .toolbar .btn {
                font-size: 11px;
                padding: 4px 8px;
            }
            .map-selector-wrap select {
                max-width: 100px;
                font-size: 12px;
                padding: 3px 8px;
            }
            .map-selector-wrap .map-count {
                font-size: 10px;
            }
            #edit-panel {
                left: 12px !important;
                right: 12px !important;
                top: 50% !important;
                transform: translateY(-50%) !important;
                min-width: unset;
                padding: 20px;
                max-width: unset;
                width: calc(100% - 24px);
                border-radius: 16px;
            }
            #edit-panel .field .icon-grid {
                gap: 6px;
            }
            #edit-panel .field .icon-option {
                width: 36px;
                height: 36px;
            }
            #context-menu {
                min-width: 140px;
            }
            #context-menu .menu-item {
                padding: 8px 16px;
                font-size: 13px;
            }
            .marker .label-text {
                font-size: 9px;
                padding: 0 6px;
                max-width: 80px;
            }
            #editNote {
                min-height: 80px;
                max-height: 200px;
            }
        }
        .hidden {
            display: none !important;
        }

        /* ===== 加载状态 ===== */
        #loading {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            z-index: 50;
            background: #0f0f1a;
            gap: 16px;
        }
        #loading .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading.hidden {
            display: none;
        }

        /* ===== 标记列表 (右侧面板) ===== */
        #marker-list-panel {
            position: fixed;
            top: 56px;
            right: 0;
            bottom: 0;
            width: 280px;
            background: rgba(18, 18, 36, 0.92);
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
            z-index: 90;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #eee;
        }
        #marker-list-panel.collapsed {
            transform: translateX(calc(100% - 40px));
        }
        #marker-list-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            min-height: 54px;
        }
        #marker-list-panel .panel-header .title {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #marker-list-panel .panel-header .toggle-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        #marker-list-panel .panel-header .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #marker-list-panel .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px 20px;
        }
        #marker-list-panel .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        #marker-list-panel .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }
        #marker-list-panel .panel-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }

        .marker-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            margin: 2px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, opacity 0.2s;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }
        .marker-list-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.04);
        }
        .marker-list-item .item-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            font-size: 18px;
        }
        .marker-list-item .item-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .marker-list-item .item-icon .emoji {
            font-size: 18px;
            line-height: 1;
        }
        .marker-list-item .item-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 0;
        }
        .marker-list-item .item-label {
            font-size: 14px;
            font-weight: 500;
            color: #e0e0ee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .marker-list-item .item-count {
            font-size: 13px;
            color: #888;
            background: rgba(255, 255, 255, 0.06);
            padding: 0 10px;
            border-radius: 12px;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            flex-shrink: 0;
        }
        .marker-list-item.hidden-state {
            opacity: 0.35;
            border-color: rgba(255, 255, 255, 0.04);
        }
        .marker-list-item.hidden-state .item-label {
            color: #666;
        }
        .marker-list-item .item-hide-badge {
            font-size: 11px;
            color: #f87171;
            background: rgba(248, 113, 113, 0.12);
            padding: 0 8px;
            border-radius: 10px;
            margin-left: 6px;
            display: none;
            font-weight: 500;
        }
        .marker-list-item.hidden-state .item-hide-badge {
            display: inline-block;
        }

        #marker-list-panel .empty-list {
            text-align: center;
            color: #555;
            font-size: 14px;
            padding: 40px 16px;
            line-height: 1.8;
        }
        #marker-list-panel .empty-list .big {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        /* 快捷键提示 */
        .shortcut-hint {
            font-size: 11px;
            color: #555;
            margin-left: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .shortcut-hint kbd {
            background: rgba(255, 255, 255, 0.06);
            padding: 0 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #888;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <!-- 加载状态 -->
    <div id="loading">
        <div class="spinner"></div>
        <span>🔄 正在加载地图资源...</span>
    </div>

    <!-- 工具栏 -->
    <header class="toolbar">
        <span class="brand">🗺️ 白银之城标记</span>
        <span class="sep"></span>

        <div class="map-selector-wrap">
            <select id="mapSelector">
                <option value="">-- 选择地图 --</option>
            </select>
            <span class="map-count" id="mapCount">0 张</span>
        </div>

        <span class="sep"></span>

        <div class="file-input-wrap">
            <button class="btn btn-success">📥 导入地图</button>
            <input type="file" id="mapFileInput" accept="image/*" />
        </div>

        <span class="sep"></span>

        <button class="btn" id="btnZoomIn">🔍+</button>
        <span class="zoom-info" id="zoomDisplay">100%</span>
        <button class="btn" id="btnZoomOut">🔍−</button>
        <button class="btn" id="btnResetView">⟲ 复位</button>

        <span class="spacer"></span>

        <button class="btn btn-warning" id="btnExportData">📤 导出标记数据</button>
        <div class="file-input-wrap">
            <button class="btn btn-primary">📥 导入标记数据</button>
            <input type="file" id="dataFileInput" accept=".json" />
        </div>

        <span class="sep"></span>

        <button class="btn" id="btnToggleLabels">🏷️ 标签</button>
        <button class="btn" id="btnDeleteMap" style="color:#f87171;">🗑️ 删除地图</button>
        <button class="btn" id="btnClearAll" style="color:#f87171;">🧹 清空标记</button>
        <button class="btn" id="btnReload">🔄 刷新资源</button>
    </header>

    <!-- 地图容器 -->
    <div id="map-container">
        <div id="map-layer">
            <img id="mapImage" src="" alt="游戏地图" draggable="false" />
        </div>
        <div id="marker-container"></div>
        <div class="empty-hint show" id="emptyHint">
            <span class="big">🖼️</span>
            请导入游戏全景地图<br />
            <span class="sub">点击「导入地图」或拖拽图片到窗口</span>
        </div>
    </div>

    <!-- 标记列表 (右侧面板) -->
    <div id="marker-list-panel">
        <div class="panel-header">
            <span class="title">📋 标记列表 <span class="shortcut-hint"><kbd>PgUp</kbd> 展开 <kbd>PgDn</kbd> 收起</span></span>
            <button class="toggle-btn" id="listToggleBtn" title="切换面板 (PgUp/PgDn)">◀</button>
        </div>
        <div class="panel-body" id="markerListBody">
            <div class="empty-list">
                <span class="big">📍</span>
                暂无标记<br />
                <span style="font-size:12px;color:#444;">右键地图添加标记</span>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu">
        <button class="menu-item" id="ctxAddMarker">
            <span class="icon">➕</span> 添加标记
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" id="ctxCancel">
            <span class="icon">✖️</span> 取消
        </button>
    </div>

    <!-- 编辑面板 -->
    <div id="edit-panel">
        <div class="panel-header">
            <h3>✏️ 编辑标记</h3>
            <button class="panel-close" id="panelClose">✕</button>
        </div>
        <div class="field">
            <label>🎨 图标</label>
            <div class="icon-grid" id="iconGrid"></div>
        </div>
        <div class="field">
            <label>🏷️ 标签</label>
            <input type="text" id="editLabel" placeholder="输入标签名称" />
            <div style="font-size:11px;color:#666;margin-top:4px;">💡 切换图标时标签会自动跟随（除非您手动修改过）</div>
        </div>
        <div class="field">
            <label>📝 备注 <span style="color:#666;font-weight:400;text-transform:none;font-size:11px;"></span></label>
            <div id="editNote" contenteditable="true"></div>
        </div>
        <div class="field">
            <label>📏 图标大小</label>
            <div class="size-control">
                <input type="range" id="editSize" min="16" max="64" value="32" step="1" />
                <span class="size-value" id="sizeValue">32</span>
            </div>
        </div>
        <div class="panel-actions">
            <button class="btn-delete" id="btnDeleteMarker">🗑️ 删除</button>
            <button class="btn-found" id="btnFoundMarker">✅ 已找到</button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  🗺️ 白银之城资源标记工具
        //  优化: 鼠标悬停显示标签 | 右侧标记列表 (PgUp/PgDn 切换)
        //  列表支持点击隐藏/显示 (按类型聚合)
        // ============================================================

        // ============================================================
        //  📋 配置你的地图和图标
        // ============================================================
        const MAP_CONFIG = {
            maps: [
                { name: '白银之城', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/map.png' },
            ],
            icons: [
                { id: '信箱', label: '信箱', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/信箱.png' },
                { id: '包裹', label: '包裹', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/包裹.png' },
                { id: '保险柜', label: '保险柜', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/保险柜.png' },
                { id: '宝箱', label: '宝箱', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/宝箱.png' },
                { id: '清剿', label: '清剿', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/清剿.png' },
                { id: '问号', label: '问号', file: 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/问号.png' },
            ]
        };

        const FALLBACK_ICONS = [
            { id: 'emoji', label: '❓', emoji: '❓' },
            { id: 'emoji_star', label: '⭐', emoji: '⭐' },
            { id: 'emoji_flag', label: '🚩', emoji: '🚩' },
        ];

        // ---- 构建图标列表 ----
        let ICON_LIST = [];
        for (const icon of MAP_CONFIG.icons) ICON_LIST.push({ ...icon });
        for (const fallback of FALLBACK_ICONS) {
            if (!ICON_LIST.find(i => i.id === fallback.id)) ICON_LIST.push({ ...fallback });
        }

        // ---- 状态 ----
        let state = {
            mapLoaded: false,
            mapWidth: 0,
            mapHeight: 0,
            scale: 1,
            translateX: 0,
            translateY: 0,
            markers: [],
            selectedId: null,
            nextId: 1,
            showLabels: true,
            currentMapId: null,
            maps: [],
            labelCustomized: {},
            // 隐藏状态: key = iconId, value = boolean (true表示隐藏)
            hiddenTypes: {},
        };

        let isDraggingMarker = false;

        // ---- DOM 引用 ----
        const container = document.getElementById('map-container');
        const mapLayer = document.getElementById('map-layer');
        const mapImage = document.getElementById('mapImage');
        const markerContainer = document.getElementById('marker-container');
        const emptyHint = document.getElementById('emptyHint');
        const loading = document.getElementById('loading');
        const zoomDisplay = document.getElementById('zoomDisplay');
        const contextMenu = document.getElementById('context-menu');
        const editPanel = document.getElementById('edit-panel');
        const iconGrid = document.getElementById('iconGrid');
        const editLabel = document.getElementById('editLabel');
        const editNote = document.getElementById('editNote');
        const editSize = document.getElementById('editSize');
        const sizeValue = document.getElementById('sizeValue');
        const toast = document.getElementById('toast');
        const mapSelector = document.getElementById('mapSelector');
        const mapCount = document.getElementById('mapCount');
        const markerListBody = document.getElementById('markerListBody');
        const listToggleBtn = document.getElementById('listToggleBtn');
        const markerListPanel = document.getElementById('marker-list-panel');

        let toastTimer = null;
        let imageLoadCount = 0;
        let totalImagesToLoad = 0;

        function showToast(msg, duration = 2000) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); }, duration);
        }

        // ---- IndexedDB 工具 ----
        const DB_NAME = 'MapMarkerDB';
        const STORE_NAME = 'mapData';
        const DB_VERSION = 2;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveAllMapsData(maps) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                await new Promise((resolve, reject) => {
                    const req = store.put({ id: 'allMaps', maps: maps, timestamp: Date.now() });
                    req.onsuccess = resolve;
                    req.onerror = () => reject(req.error);
                });
                db.close();
                return true;
            } catch (e) { console.warn('保存地图列表失败:', e); return false; }
        }

        async function loadAllMapsData() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const data = await new Promise((resolve, reject) => {
                    const req = store.get('allMaps');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                db.close();
                return data ? data.maps : null;
            } catch (e) { console.warn('读取地图列表失败:', e); return null; }
        }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function genId() { return state.nextId++; }

        function storageKey(mapId) { return 'map_markers_' + mapId; }

        function labelCustomizedKey(mapId) { return 'map_label_customized_' + mapId; }

        function hiddenTypesKey(mapId) { return 'map_hidden_types_' + mapId; }

        function generateMapId() { return 'map_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

        function mapToView(mapX, mapY) {
            return { x: mapX * state.scale + state.translateX, y: mapY * state.scale + state.translateY };
        }

        function viewToMap(vx, vy) {
            return { x: (vx - state.translateX) / state.scale, y: (vy - state.translateY) / state.scale };
        }

        // ---- 获取图标的显示名称 ----
        function getIconLabel(iconId) {
            const info = ICON_LIST.find(i => i.id === iconId || i.emoji === iconId);
            return info ? info.label : iconId;
        }

        // ---- 获取图标渲染内容 ----
        function getIconRender(iconId, size = 28) {
            const info = ICON_LIST.find(i => i.id === iconId || i.emoji === iconId);
            if (info && info.file) {
                return `<img src="${info.file}" alt="${info.label}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;" />`;
            }
            return `<span class="emoji" style="font-size:${size * 0.7}px;">${info ? info.emoji || '❓' : '❓'}</span>`;
        }

        // ---- 渲染标记（增加悬停标签支持） ----
        function renderMarkers() {
            markerContainer.innerHTML = '';
            if (!state.mapLoaded) return;
            const sorted = [...state.markers].sort((a, b) => a.id - b.id);
            const hiddenSet = new Set(Object.keys(state.hiddenTypes).filter(k => state.hiddenTypes[k] === true));
            for (const m of sorted) {
                // 如果该类型被隐藏，跳过渲染
                const iconKey = m.icon;
                if (hiddenSet.has(iconKey)) continue;

                const pos = mapToView(m.x, m.y);
                const size = m.size || 32;
                const el = document.createElement('div');
                el.className = 'marker';
                if (m.found) el.classList.add('found');
                el.dataset.id = m.id;
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                el.style.width = size + 'px';
                el.style.height = size + 'px';

                // 自定义属性存储标签名，用于悬停显示
                el.dataset.label = m.label || getIconLabel(m.icon) || '标记';

                const wrap = document.createElement('div');
                wrap.className = 'icon-wrap';
                wrap.style.width = size + 'px';
                wrap.style.height = size + 'px';
                wrap.style.fontSize = (size * 0.7) + 'px';

                const iconInfo = ICON_LIST.find(i => i.id === m.icon || i.emoji === m.icon);
                if (iconInfo && iconInfo.file) {
                    const img = document.createElement('img');
                    img.src = iconInfo.file;
                    img.alt = iconInfo.label;
                    img.draggable = false;
                    img.onerror = function() { this.parentElement.innerHTML = `<span class="emoji">❓</span>`; };
                    wrap.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.className = 'emoji';
                    span.textContent = m.icon || '❓';
                    wrap.appendChild(span);
                }

                const badge = document.createElement('div');
                badge.className = 'check-badge';
                badge.textContent = '✓';
                wrap.appendChild(badge);

                el.appendChild(wrap);

                // 标签（可显示/隐藏）
                if (state.showLabels && m.label) {
                    const labelEl = document.createElement('div');
                    labelEl.className = 'label-text';
                    labelEl.textContent = m.label;
                    el.appendChild(labelEl);
                }

                // 悬停显示标签（tooltip风格）
                el.addEventListener('mouseenter', (e) => {
                    const label = el.dataset.label;
                    if (label && !state.showLabels) {
                        // 如果全局标签关闭，用title显示
                        el.title = label;
                    } else if (label) {
                        el.title = label;
                    }
                });
                el.addEventListener('mouseleave', () => {
                    el.title = '';
                });

                el.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    e.stopPropagation();
                    const rect = el.getBoundingClientRect();
                    const size = m.size || 32;
                    const offsetX = (e.clientX - rect.left) * (size / rect.width);
                    const offsetY = (e.clientY - rect.top) * (size / rect.height);
                    window._dragData = { id: m.id, offsetX: offsetX, offsetY: offsetY };
                    isDraggingMarker = false;
                });
                el.addEventListener('click', (e) => {
                    if (isDraggingMarker) return;
                    e.stopPropagation();
                    openEditPanel(m.id);
                });
                markerContainer.appendChild(el);
            }
            if (state.mapLoaded) emptyHint.classList.remove('show');
            // 更新标记列表
            renderMarkerList();
        }

        // ---- 渲染标记列表 (右侧面板) ----
        function renderMarkerList() {
            if (!state.mapLoaded) {
                markerListBody.innerHTML = `<div class="empty-list"><span class="big">🗺️</span>请先加载地图</div>`;
                return;
            }
            if (state.markers.length === 0) {
                markerListBody.innerHTML = `<div class="empty-list"><span class="big">📍</span>暂无标记<br /><span style="font-size:12px;color:#444;">右键地图添加标记</span></div>`;
                return;
            }

            // 按 icon 分组
            const groups = {};
            for (const m of state.markers) {
                const key = m.icon;
                if (!groups[key]) groups[key] = [];
                groups[key].push(m);
            }

            let html = '';
            // 排序：按数量从多到少
            const sortedKeys = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
            for (const key of sortedKeys) {
                const items = groups[key];
                const count = items.length;
                const label = items[0].label || getIconLabel(key) || key;
                const isHidden = state.hiddenTypes[key] === true;
                const iconHtml = getIconRender(key, 24);

                html += `
                    <div class="marker-list-item ${isHidden ? 'hidden-state' : ''}" data-icon="${key}">
                        <div class="item-icon">${iconHtml}</div>
                        <div class="item-info">
                            <span class="item-label">${label}</span>
                            <span class="item-count">${count}</span>
                            <span class="item-hide-badge">隐藏</span>
                        </div>
                    </div>
                `;
            }

            markerListBody.innerHTML = html;

            // 绑定点击事件：切换隐藏/显示
            document.querySelectorAll('.marker-list-item').forEach(el => {
                el.addEventListener('click', () => {
                    const icon = el.dataset.icon;
                    if (!icon) return;
                    // 切换隐藏状态
                    state.hiddenTypes[icon] = !state.hiddenTypes[icon];
                    // 保存到 localStorage
                    try {
                        localStorage.setItem(hiddenTypesKey(state.currentMapId), JSON.stringify(state.hiddenTypes));
                    } catch (e) { /* ignore */ }
                    renderMarkers();
                    showToast(state.hiddenTypes[icon] ? `👁️ 已隐藏 "${getIconLabel(icon)}"` :
                        `👁️ 已显示 "${getIconLabel(icon)}"`, 1200);
                });
            });
        }

        // ---- 全局拖拽 ----
        let mapDrag = null;
        document.addEventListener('mousemove', (e) => {
            if (window._dragData) {
                const { id, offsetX, offsetY } = window._dragData;
                const rect = container.getBoundingClientRect();
                const vx = e.clientX - rect.left - offsetX;
                const vy = e.clientY - rect.top - offsetY;
                const mapPos = viewToMap(vx, vy);
                const m = state.markers.find(m => m.id === id);
                if (m) {
                    m.x = clamp(mapPos.x, 0, state.mapWidth);
                    m.y = clamp(mapPos.y, 0, state.mapHeight);
                    isDraggingMarker = true;
                    renderMarkers();
                    saveMarkers();
                }
                e.preventDefault();
                return;
            }
            if (mapDrag) {
                const dx = e.clientX - mapDrag.startX;
                const dy = e.clientY - mapDrag.startY;
                state.translateX = mapDrag.tx + dx;
                state.translateY = mapDrag.ty + dy;
                updateTransform();
                renderMarkers();
                e.preventDefault();
            }
        });
        document.addEventListener('mouseup', () => {
            if (window._dragData) {
                window._dragData = null;
                setTimeout(() => { isDraggingMarker = false; }, 10);
                container.classList.remove('grabbing');
                return;
            }
            if (mapDrag) { mapDrag = null;
                container.classList.remove('grabbing'); }
        });
        container.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (e.target.closest('.marker')) return;
            if (e.target.closest('#context-menu')) return;
            if (e.target.closest('#edit-panel')) return;
            mapDrag = { startX: e.clientX, startY: e.clientY, tx: state.translateX, ty: state.translateY };
            container.classList.add('grabbing');
        });
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            const newScale = clamp(state.scale * (1 + delta), 0.1, 20);
            const rect = container.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const mapPos = viewToMap(mx, my);
            state.scale = newScale;
            state.translateX = mx - mapPos.x * state.scale;
            state.translateY = my - mapPos.y * state.scale;
            updateTransform();
            renderMarkers();
            updateZoomDisplay();
        }, { passive: false });

        function updateTransform() {
            mapLayer.style.transform = `translate(${state.translateX}px, ${state.translateY}px) scale(${state.scale})`;
        }

        function updateZoomDisplay() {
            zoomDisplay.textContent = Math.round(state.scale * 100) + '%';
        }

        // ---- 地图加载（从远程URL直接加载）----
        function loadMapFromUrl(imageUrl, mapId, mapName, width, height) {
            state.mapWidth = width;
            state.mapHeight = height;
            state.mapLoaded = true;
            state.currentMapId = mapId;

            const existing = state.maps.find(m => m.id === mapId);
            if (!existing) {
                state.maps.push({ id: mapId, name: mapName || '未命名地图', dataURL: imageUrl, width: width, height: height });
            } else {
                existing.dataURL = imageUrl;
                existing.name = mapName || existing.name;
                existing.width = width;
                existing.height = height;
            }

            saveAllMapsData(state.maps);
            updateMapSelector();

            mapImage.src = imageUrl;
            mapImage.style.width = width + 'px';
            mapImage.style.height = height + 'px';

            const rect = container.getBoundingClientRect();
            const pad = 40;
            const scaleX = (rect.width - pad) / width;
            const scaleY = (rect.height - pad) / height;
            state.scale = clamp(Math.min(scaleX, scaleY), 0.1, 5);
            state.translateX = (rect.width - width * state.scale) / 2;
            state.translateY = (rect.height - height * state.scale) / 2;
            updateTransform();
            updateZoomDisplay();
            emptyHint.classList.remove('show');

            loadMarkers();
            renderMarkers();
            mapSelector.value = mapId;
            showToast('✅ 已加载: ' + (mapName || '未命名地图'));
            loading.classList.add('hidden');

            autoLoadFromRepo();
        }

        // ---- 地图加载（从DataURL本地数据加载）----
        function loadMapFromData(dataURL, mapId, mapName, width, height) {
            state.mapWidth = width;
            state.mapHeight = height;
            state.mapLoaded = true;
            state.currentMapId = mapId;
            const existing = state.maps.find(m => m.id === mapId);
            if (!existing) {
                state.maps.push({ id: mapId, name: mapName || '未命名地图', dataURL: dataURL, width: width, height: height });
            } else {
                existing.dataURL = dataURL;
                existing.name = mapName || existing.name;
                existing.width = width;
                existing.height = height;
            }
            saveAllMapsData(state.maps);
            updateMapSelector();
            mapImage.src = dataURL;
            mapImage.style.width = width + 'px';
            mapImage.style.height = height + 'px';
            const rect = container.getBoundingClientRect();
            const pad = 40;
            const scaleX = (rect.width - pad) / width;
            const scaleY = (rect.height - pad) / height;
            state.scale = clamp(Math.min(scaleX, scaleY), 0.1, 5);
            state.translateX = (rect.width - width * state.scale) / 2;
            state.translateY = (rect.height - height * state.scale) / 2;
            updateTransform();
            updateZoomDisplay();
            emptyHint.classList.remove('show');
            loadMarkers();
            renderMarkers();
            mapSelector.value = mapId;
            showToast('✅ 已加载: ' + (mapName || '未命名地图'));
            loading.classList.add('hidden');
            autoLoadFromRepo();
        }

        // ---- 从仓库加载地图 ----
        function loadMapFromRepo(mapConfig) {
            const filePath = mapConfig.file;
            console.log('📂 尝试加载地图:', filePath);
            const img = new Image();
            img.onload = () => {
                console.log('✅ 地图加载成功:', filePath);
                const mapId = generateMapId();
                const mapName = mapConfig.name || filePath.replace(/\.[^.]+$/, '');
                state.maps.push({
                    id: mapId,
                    name: mapName,
                    dataURL: filePath,
                    width: img.width,
                    height: img.height
                });
                if (state.maps.length === 1) {
                    loadMapFromUrl(filePath, mapId, mapName, img.width, img.height);
                }
                imageLoadCount++;
                checkAllImagesLoaded();
            };
            img.onerror = () => {
                console.warn('⚠️ 加载地图失败:', filePath);
                imageLoadCount++;
                checkAllImagesLoaded();
            };
            img.src = filePath;
        }

        // ---- 检查所有图片是否加载完成 ----
        function checkAllImagesLoaded() {
            console.log('📊 加载进度:', imageLoadCount, '/', totalImagesToLoad);
            if (imageLoadCount >= totalImagesToLoad) {
                if (state.maps.length === 0) {
                    loading.classList.add('hidden');
                    emptyHint.classList.add('show');
                    showToast('⚠️ 没有找到地图图片', 3000);
                } else {
                    updateMapSelector();
                    saveAllMapsData(state.maps);
                    if (!state.mapLoaded && state.maps.length > 0) {
                        const first = state.maps[0];
                        if (first.dataURL && (first.dataURL.startsWith('http://') || first.dataURL.startsWith('https://'))) {
                            loadMapFromUrl(first.dataURL, first.id, first.name, first.width, first.height);
                        } else {
                            loadMapFromData(first.dataURL, first.id, first.name, first.width, first.height);
                        }
                    }
                }
            }
        }

        // ---- 初始化：从仓库加载所有资源 ----
        function initFromRepo() {
            loading.classList.remove('hidden');
            imageLoadCount = 0;
            totalImagesToLoad = MAP_CONFIG.maps.length + MAP_CONFIG.icons.length;
            console.log('📦 总资源数:', totalImagesToLoad);
            if (totalImagesToLoad === 0) {
                loading.classList.add('hidden');
                emptyHint.classList.add('show');
                updateMapSelector();
                showToast('⚠️ 没有配置任何资源', 2000);
                return;
            }
            for (const map of MAP_CONFIG.maps) loadMapFromRepo(map);
            for (const icon of MAP_CONFIG.icons) {
                const img = new Image();
                img.onload = () => { imageLoadCount++;
                    checkAllImagesLoaded(); };
                img.onerror = () => { imageLoadCount++;
                    checkAllImagesLoaded(); };
                img.src = icon.file;
            }
        }

        // ---- 自动从仓库加载 map_editor_state.json ----
        function autoLoadFromRepo() {
            if (!state.mapLoaded) {
                console.log('⏳ 地图未加载完成，稍后重试...');
                setTimeout(autoLoadFromRepo, 500);
                return;
            }
            const hasLocalData = localStorage.getItem(storageKey(state.currentMapId));
            if (hasLocalData && state.markers.length > 0) {
                console.log('📂 已有本地标记数据，跳过自动加载');
                return;
            }
            const jsonUrl = 'https://gh-proxy.org/https://raw.githubusercontent.com/lTwTlol/silverpalace-map.github.io/main/map_editor_state.json';
            console.log('📂 自动从仓库加载:', jsonUrl);
            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('✅ 成功加载仓库数据:', data);
                    if (importMarkers(data, true)) {
                        showToast('✅ 已从仓库加载标记数据', 2000);
                    }
                })
                .catch(err => {
                    console.log('ℹ️ 仓库中没有 map_editor_state.json，跳过自动加载');
                });
        }

        // ============================================================
        //  导入 / 导出标记数据
        // ============================================================

        function exportMarkers() {
            if (!state.mapLoaded || state.markers.length === 0) {
                showToast('⚠️ 没有标记可导出', 1500);
                return;
            }
            const exportData = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                mapId: state.currentMapId,
                mapName: state.maps.find(m => m.id === state.currentMapId)?.name || '未命名',
                mapWidth: state.mapWidth,
                mapHeight: state.mapHeight,
                markers: state.markers,
                nextId: state.nextId,
                labelCustomized: state.labelCustomized,
                hiddenTypes: state.hiddenTypes,
            };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'map_editor_state.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('📤 已导出 ' + state.markers.length + ' 个标记', 2000);
        }

        function importMarkers(jsonData, silent = false) {
            try {
                const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                if (!data.markers || !Array.isArray(data.markers)) {
                    if (!silent) showToast('❌ 无效的数据格式', 1500);
                    return false;
                }
                if (!state.mapLoaded) {
                    if (!silent) showToast('❌ 请先加载地图', 1500);
                    return false;
                }
                const count = data.markers.length;
                if (count === 0) {
                    if (!silent) showToast('⚠️ 数据中没有标记', 1500);
                    return false;
                }
                if (state.markers.length > 0 && !silent) {
                    if (!confirm(`当前有 ${state.markers.length} 个标记，导入将覆盖它们。\n\n继续吗？`)) {
                        return false;
                    }
                }
                if (data.mapWidth && data.mapHeight) {
                    if (data.mapWidth !== state.mapWidth || data.mapHeight !== state.mapHeight) {
                        console.warn('⚠️ 地图尺寸不匹配，标记位置可能偏移');
                        if (!silent) {
                            if (!confirm(`⚠️ 地图尺寸不匹配 (数据: ${data.mapWidth}x${data.mapHeight}, 当前: ${state.mapWidth}x${state.mapHeight})\n\n标记位置可能不准确，继续吗？`)) {
                                return false;
                            }
                        }
                    }
                }
                state.markers = data.markers.map(m => ({
                    ...m,
                    x: clamp(m.x || 0, 0, state.mapWidth),
                    y: clamp(m.y || 0, 0, state.mapHeight),
                }));
                state.nextId = data.nextId || Math.max(...state.markers.map(m => m.id), 0) + 1;
                if (data.labelCustomized) {
                    state.labelCustomized = data.labelCustomized;
                } else {
                    state.labelCustomized = {};
                    for (const m of state.markers) {
                        state.labelCustomized[m.id] = false;
                    }
                }
                if (data.hiddenTypes) {
                    state.hiddenTypes = data.hiddenTypes;
                } else {
                    state.hiddenTypes = {};
                }
                renderMarkers();
                saveMarkers();
                if (!silent) showToast(`✅ 成功导入 ${state.markers.length} 个标记`, 2000);
                return true;
            } catch (e) {
                console.error('导入失败:', e);
                if (!silent) showToast('❌ 导入失败: ' + e.message, 2000);
                return false;
            }
        }

        // ---- 切换地图 ----
        function switchMap(mapId) {
            if (!mapId) {
                state.mapLoaded = false;
                state.markers = [];
                mapImage.src = '';
                emptyHint.classList.add('show');
                renderMarkers();
                state.currentMapId = null;
                return;
            }
            const mapData = state.maps.find(m => m.id === mapId);
            if (!mapData) { showToast('❌ 找不到地图数据', 1500); return; }
            if (state.currentMapId && state.mapLoaded) saveMarkers();
            if (mapData.dataURL && (mapData.dataURL.startsWith('http://') || mapData.dataURL.startsWith('https://'))) {
                loadMapFromUrl(mapData.dataURL, mapId, mapData.name, mapData.width, mapData.height);
            } else {
                loadMapFromData(mapData.dataURL, mapId, mapData.name, mapData.width, mapData.height);
            }
        }

        // ---- 更新地图选择器 ----
        function updateMapSelector() {
            const currentValue = mapSelector.value;
            mapSelector.innerHTML = '<option value="">-- 选择地图 --</option>';
            for (const m of state.maps) {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name + ' (' + m.width + '×' + m.height + ')';
                if (m.id === state.currentMapId) opt.selected = true;
                mapSelector.appendChild(opt);
            }
            mapCount.textContent = state.maps.length + ' 张';
        }

        // ---- 标记数据持久化 ----
        function saveMarkers() {
            if (!state.mapLoaded || !state.currentMapId) return;
            try {
                localStorage.setItem(storageKey(state.currentMapId), JSON.stringify({ markers: state.markers, nextId: state
                        .nextId }));
                localStorage.setItem(labelCustomizedKey(state.currentMapId), JSON.stringify(state.labelCustomized));
                localStorage.setItem(hiddenTypesKey(state.currentMapId), JSON.stringify(state.hiddenTypes));
            } catch (e) { /* ignore */ }
        }

        function loadMarkers() {
            if (!state.mapLoaded || !state.currentMapId) return;
            try {
                const raw = localStorage.getItem(storageKey(state.currentMapId));
                if (!raw) { state.markers = [];
                    state.nextId = 1;
                    state.labelCustomized = {};
                    state.hiddenTypes = {}; return; }
                const data = JSON.parse(raw);
                state.markers = data.markers || [];
                state.nextId = data.nextId || 1;
                state.markers = state.markers.filter(m => m.x >= 0 && m.x <= state.mapWidth && m.y >= 0 && m.y <= state
                    .mapHeight);
                const customRaw = localStorage.getItem(labelCustomizedKey(state.currentMapId));
                state.labelCustomized = customRaw ? JSON.parse(customRaw) : {};
                const hiddenRaw = localStorage.getItem(hiddenTypesKey(state.currentMapId));
                state.hiddenTypes = hiddenRaw ? JSON.parse(hiddenRaw) : {};
                renderMarkers();
            } catch (e) { /* ignore */ }
        }

        // ---- 备注相关 ----
        function getNoteContent() {
            const children = editNote.childNodes;
            let result = [];
            for (const node of children) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent.trim();
                    if (text) result.push({ type: 'text', content: text });
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.tagName === 'IMG') result.push({ type: 'image', src: node.src });
                    else if (node.tagName === 'DIV' && node.classList.contains('note-img-wrap')) {
                        const img = node.querySelector('img');
                        if (img) result.push({ type: 'image', src: img.src });
                    } else {
                        const text = node.textContent.trim();
                        if (text) result.push({ type: 'text', content: text });
                    }
                }
            }
            return result;
        }

        function setNoteContent(data) {
            editNote.innerHTML = '';
            if (!data || data.length === 0) return;
            for (const item of data) {
                if (item.type === 'text') editNote.appendChild(document.createTextNode(item.content));
                else if (item.type === 'image' && item.src) {
                    const wrap = document.createElement('div');
                    wrap.className = 'note-img-wrap';
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.draggable = false;
                    const del = document.createElement('button');
                    del.className = 'img-delete';
                    del.textContent = '✕';
                    del.title = '删除图片';
                    del.addEventListener('click', (e) => { e.stopPropagation();
                        wrap.remove();
                        onNoteChange(); });
                    wrap.appendChild(img);
                    wrap.appendChild(del);
                    editNote.appendChild(wrap);
                }
            }
        }

        let noteChangeTimer = null;

        function onNoteChange() {
            clearTimeout(noteChangeTimer);
            noteChangeTimer = setTimeout(() => {
                const id = parseInt(editPanel.dataset.editId);
                const m = state.markers.find(m => m.id === id);
                if (!m) return;
                m.note = JSON.stringify(getNoteContent());
                saveMarkers();
            }, 200);
        }

        editNote.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const dataURL = ev.target.result;
                        const wrap = document.createElement('div');
                        wrap.className = 'note-img-wrap';
                        const img = document.createElement('img');
                        img.src = dataURL;
                        img.draggable = false;
                        const del = document.createElement('button');
                        del.className = 'img-delete';
                        del.textContent = '✕';
                        del.addEventListener('click', (e) => { e.stopPropagation();
                            wrap.remove();
                            onNoteChange(); });
                        wrap.appendChild(img);
                        wrap.appendChild(del);
                        const sel = window.getSelection();
                        if (sel.rangeCount > 0) {
                            const range = sel.getRangeAt(0);
                            range.deleteContents();
                            range.insertNode(wrap);
                            const space = document.createTextNode(' ');
                            range.setStartAfter(wrap);
                            range.insertNode(space);
                            range.setStartAfter(space);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        } else { editNote.appendChild(wrap);
                            editNote.appendChild(document.createTextNode(' ')); }
                        onNoteChange();
                        showToast('✅ 图片已粘贴到备注');
                    };
                    reader.readAsDataURL(file);
                }
            }
            if (e.clipboardData.items.length > 0) e.preventDefault();
        });
        editNote.addEventListener('input', onNoteChange);
        editNote.addEventListener('blur', () => { clearTimeout(noteChangeTimer);
            onNoteChange(); });

        // ---- 添加标记 ----
        function addMarker(mapX, mapY) {
            if (!state.mapLoaded) return;
            const m = {
                id: genId(),
                x: clamp(mapX, 0, state.mapWidth),
                y: clamp(mapY, 0, state.mapHeight),
                icon: ICON_LIST.length > 0 ? (ICON_LIST[0].id || '❓') : '❓',
                label: ICON_LIST.length > 0 ? ICON_LIST[0].label : '❓',
                note: '[]',
                size: 32,
                found: false,
            };
            state.markers.push(m);
            state.labelCustomized[m.id] = false;
            renderMarkers();
            saveMarkers();
            openEditPanel(m.id);
        }

        function deleteMarker(id) {
            state.markers = state.markers.filter(m => m.id !== id);
            delete state.labelCustomized[id];
            if (state.selectedId === id) state.selectedId = null;
            renderMarkers();
            saveMarkers();
            closeEditPanel();
        }

        // ---- 切换 found 状态 ----
        function toggleFound(id) {
            const m = state.markers.find(m => m.id === id);
            if (!m) return;
            m.found = !m.found;
            renderMarkers();
            saveMarkers();
            const foundBtn = document.getElementById('btnFoundMarker');
            if (m.found) {
                foundBtn.textContent = '✅ 已找到 ✓';
                foundBtn.classList.add('active');
            } else {
                foundBtn.textContent = '✅ 已找到';
                foundBtn.classList.remove('active');
            }
            showToast(m.found ? '✅ 标记为已找到' : '↩️ 取消已找到状态', 1200);
        }

        // ---- 打开编辑面板 ----
        function openEditPanel(id) {
            const m = state.markers.find(m => m.id === id);
            if (!m) return;
            state.selectedId = id;
            renderIconGrid(m.icon);
            editLabel.value = m.label || '';
            editLabel.dataset.customized = state.labelCustomized[m.id] ? 'true' : 'false';
            try { setNoteContent(JSON.parse(m.note || '[]')); } catch (e) { editNote.innerHTML = m.note || ''; }
            editSize.value = m.size || 32;
            sizeValue.textContent = m.size || 32;

            const foundBtn = document.getElementById('btnFoundMarker');
            if (m.found) {
                foundBtn.textContent = '✅ 已找到 ✓';
                foundBtn.classList.add('active');
            } else {
                foundBtn.textContent = '✅ 已找到';
                foundBtn.classList.remove('active');
            }

            const rect = container.getBoundingClientRect();
            const pos = mapToView(m.x, m.y);
            const panelW = Math.min(420, window.innerWidth - 40);
            const panelH = 540;
            let left = pos.x + 20,
                top = pos.y - 40;
            if (left + panelW > window.innerWidth - 20) left = pos.x - panelW - 20;
            if (left < 20) left = 20;
            if (top + panelH > window.innerHeight - 80) top = window.innerHeight - panelH - 80;
            if (top < 80) top = 80;
            editPanel.style.left = left + 'px';
            editPanel.style.top = top + 'px';
            editPanel.style.display = 'block';
            editPanel.dataset.editId = id;
            setTimeout(() => editLabel.focus(), 100);
        }

        function closeEditPanel() { editPanel.style.display = 'none';
            state.selectedId = null; }

        // ---- 图标网格 ----
        function renderIconGrid(selectedIcon) {
            iconGrid.innerHTML = '';
            for (const info of ICON_LIST) {
                const div = document.createElement('div');
                div.className = 'icon-option';
                if (info.id === selectedIcon || info.emoji === selectedIcon) div.classList.add('active');
                if (info.file) {
                    const img = document.createElement('img');
                    img.src = info.file;
                    img.alt = info.label;
                    img.draggable = false;
                    img.onerror = function() { this.parentElement.innerHTML = `<span class="emoji">❓</span>`; };
                    div.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.className = 'emoji';
                    span.textContent = info.emoji || '❓';
                    div.appendChild(span);
                }
                div.dataset.iconId = info.id;
                div.addEventListener('click', () => {
                    iconGrid.querySelectorAll('.icon-option').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    const id = parseInt(editPanel.dataset.editId);
                    const m = state.markers.find(m => m.id === id);
                    if (!m) return;
                    const newIcon = info.id === 'emoji' ? info.emoji : info.id;
                    m.icon = newIcon;
                    if (!state.labelCustomized[id]) {
                        m.label = info.label;
                        editLabel.value = info.label;
                    }
                    renderMarkers();
                    saveMarkers();
                });
                iconGrid.appendChild(div);
            }
        }

        // ---- 事件绑定 ----
        editLabel.addEventListener('input', () => {
            const id = parseInt(editPanel.dataset.editId);
            const m = state.markers.find(m => m.id === id);
            if (!m) return;
            m.label = editLabel.value.trim() || '标记';
            state.labelCustomized[id] = true;
            renderMarkers();
            saveMarkers();
        });
        editSize.addEventListener('input', () => {
            sizeValue.textContent = editSize.value;
            const id = parseInt(editPanel.dataset.editId);
            const m = state.markers.find(m => m.id === id);
            if (!m) return;
            m.size = parseInt(editSize.value);
            renderMarkers();
            saveMarkers();
        });

        document.getElementById('btnFoundMarker').addEventListener('click', () => {
            const id = parseInt(editPanel.dataset.editId);
            if (id) toggleFound(id);
        });

        // ---- 重置视图 ----
        function resetView() {
            if (!state.mapLoaded) return;
            const rect = container.getBoundingClientRect();
            const pad = 40;
            const scaleX = (rect.width - pad) / state.mapWidth;
            const scaleY = (rect.height - pad) / state.mapHeight;
            state.scale = clamp(Math.min(scaleX, scaleY), 0.1, 5);
            state.translateX = (rect.width - state.mapWidth * state.scale) / 2;
            state.translateY = (rect.height - state.mapHeight * state.scale) / 2;
            updateTransform();
            updateZoomDisplay();
            renderMarkers();
        }

        function toggleLabels() {
            state.showLabels = !state.showLabels;
            renderMarkers();
            document.getElementById('btnToggleLabels').style.opacity = state.showLabels ? '1' : '0.4';
        }

        function clearAllMarkers() {
