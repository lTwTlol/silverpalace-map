            if (!state.mapLoaded || state.markers.length === 0) return;
            if (!confirm('⚠️ 确定要清空当前地图的所有标记吗？')) return;
            state.markers = [];
            state.labelCustomized = {};
            state.hiddenTypes = {};
            renderMarkers();
            saveMarkers();
            closeEditPanel();
            showToast('🧹 已清空所有标记', 1500);
        }

        function deleteCurrentMap() {
            if (!state.currentMapId) { showToast('⚠️ 没有地图可删除', 1500); return; }
            const mapData = state.maps.find(m => m.id === state.currentMapId);
            if (!mapData) return;
            if (!confirm(`确定要删除地图 "${mapData.name}" 及其所有标记吗？`)) return;
            localStorage.removeItem(storageKey(state.currentMapId));
            localStorage.removeItem(labelCustomizedKey(state.currentMapId));
            localStorage.removeItem(hiddenTypesKey(state.currentMapId));
            state.maps = state.maps.filter(m => m.id !== state.currentMapId);
            saveAllMapsData(state.maps);
            state.mapLoaded = false;
            state.markers = [];
            state.currentMapId = null;
            state.labelCustomized = {};
            state.hiddenTypes = {};
            mapImage.src = '';
            emptyHint.classList.add('show');
            renderMarkers();
            updateMapSelector();
            showToast('🗑️ 已删除地图', 1500);
        }

        // ---- 右键菜单 ----
        let contextPos = { x: 0, y: 0 };
        container.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (!state.mapLoaded) return;
            if (e.target.closest('.marker')) return;
            if (e.target.closest('#edit-panel')) return;
            contextPos.x = e.clientX;
            contextPos.y = e.clientY;
            const menuW = 180,
                menuH = 100;
            let left = e.clientX,
                top = e.clientY;
            if (left + menuW > window.innerWidth - 10) left = window.innerWidth - menuW - 10;
            if (top + menuH > window.innerHeight - 10) top = window.innerHeight - menuH - 10;
            if (left < 10) left = 10;
            if (top < 60) top = 60;
            contextMenu.style.left = left + 'px';
            contextMenu.style.top = top + 'px';
            contextMenu.style.display = 'block';
        });
        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) contextMenu.style.display = 'none';
            if (editPanel.style.display === 'block') {
                const isClickInsidePanel = editPanel.contains(e.target);
                const isClickOnMarker = e.target.closest('.marker');
                const isClickOnContext = contextMenu.contains(e.target);
                const isClickOnToolbar = e.target.closest('.toolbar');
                if (!isClickInsidePanel && !isClickOnMarker && !isClickOnContext && !isClickOnToolbar) {
                    closeEditPanel();
                }
            }
        });
        document.getElementById('ctxAddMarker').addEventListener('click', () => {
            contextMenu.style.display = 'none';
            if (!state.mapLoaded) return;
            const rect = container.getBoundingClientRect();
            const vx = contextPos.x - rect.left;
            const vy = contextPos.y - rect.top;
            const mapPos = viewToMap(vx, vy);
            if (mapPos.x >= 0 && mapPos.x <= state.mapWidth &&
                mapPos.y >= 0 && mapPos.y <= state.mapHeight) {
                addMarker(mapPos.x, mapPos.y);
            }
        });
        document.getElementById('ctxCancel').addEventListener('click', () => { contextMenu.style.display = 'none'; });

        // ---- 面板事件 ----
        document.getElementById('panelClose').addEventListener('click', closeEditPanel);
        document.getElementById('btnDeleteMarker').addEventListener('click', () => {
            const id = parseInt(editPanel.dataset.editId);
            if (id) deleteMarker(id);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeEditPanel();
                contextMenu.style.display = 'none'; }
            // PgUp: 展开面板, PgDn: 收起面板
            if (e.key === 'PageUp') {
                e.preventDefault();
                markerListPanel.classList.remove('collapsed');
                listToggleBtn.textContent = '◀';
                listToggleBtn.title = '收起 (PgDn)';
            }
            if (e.key === 'PageDown') {
                e.preventDefault();
                markerListPanel.classList.add('collapsed');
                listToggleBtn.textContent = '▶';
                listToggleBtn.title = '展开 (PgUp)';
            }
        });

        // ---- 工具栏按钮 ----
        document.getElementById('btnZoomIn').addEventListener('click', () => {
            state.scale = clamp(state.scale * 1.2, 0.1, 20);
            const rect = container.getBoundingClientRect();
            const cx = rect.width / 2,
                cy = rect.height / 2;
            const mapPos = viewToMap(cx, cy);
            state.translateX = cx - mapPos.x * state.scale;
            state.translateY = cy - mapPos.y * state.scale;
            updateTransform();
            updateZoomDisplay();
            renderMarkers();
        });
        document.getElementById('btnZoomOut').addEventListener('click', () => {
            state.scale = clamp(state.scale / 1.2, 0.1, 20);
            const rect = container.getBoundingClientRect();
            const cx = rect.width / 2,
                cy = rect.height / 2;
            const mapPos = viewToMap(cx, cy);
            state.translateX = cx - mapPos.x * state.scale;
            state.translateY = cy - mapPos.y * state.scale;
            updateTransform();
            updateZoomDisplay();
            renderMarkers();
        });
        document.getElementById('btnResetView').addEventListener('click', resetView);
        document.getElementById('btnToggleLabels').addEventListener('click', toggleLabels);
        document.getElementById('btnToggleLabels').style.opacity = '1';
        document.getElementById('btnClearAll').addEventListener('click', clearAllMarkers);
        document.getElementById('btnDeleteMap').addEventListener('click', deleteCurrentMap);

        // ---- 刷新资源 ----
        document.getElementById('btnReload').addEventListener('click', () => {
            state.maps = [];
            state.markers = [];
            state.mapLoaded = false;
            state.currentMapId = null;
            state.hiddenTypes = {};
            mapImage.src = '';
            emptyHint.classList.add('show');
            renderMarkers();
            updateMapSelector();
            localStorage.clear();
            setTimeout(() => { initFromRepo(); }, 300);
            showToast('🔄 正在刷新资源...', 1500);
        });

        // ---- 绑定导入/导出 ----
        document.getElementById('btnExportData').addEventListener('click', exportMarkers);
        document.getElementById('dataFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (importMarkers(data)) {
                        showToast('✅ 导入成功！', 1500);
                    }
                } catch (err) {
                    showToast('❌ 解析 JSON 失败: ' + err.message, 2000);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // ---- 地图选择器 ----
        mapSelector.addEventListener('change', (e) => {
            const mapId = e.target.value;
            if (mapId) {
                switchMap(mapId);
            } else {
                if (state.currentMapId) saveMarkers();
                state.mapLoaded = false;
                state.markers = [];
                state.currentMapId = null;
                state.labelCustomized = {};
                state.hiddenTypes = {};
                mapImage.src = '';
                emptyHint.classList.add('show');
                renderMarkers();
            }
        });

        // ---- 导入地图 ----
        document.getElementById('mapFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const name = file.name.replace(/\.[^.]+$/, '');
                const existing = state.maps.find(m => m.name === name);
                if (existing) {
                    if (!confirm(`已存在地图 "${name}"，是否覆盖？`)) { e.target.value = ''; return; }
                    localStorage.removeItem(storageKey(existing.id));
                    localStorage.removeItem(labelCustomizedKey(existing.id));
                    localStorage.removeItem(hiddenTypesKey(existing.id));
                    state.maps = state.maps.filter(m => m.id !== existing.id);
                }
                addNewMap(file);
            }
            e.target.value = '';
        });

        function addNewMap(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const mapId = generateMapId();
                    const mapName = file.name.replace(/\.[^.]+$/, '');
                    loadMapFromData(e.target.result, mapId, mapName, img.width, img.height);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        container.addEventListener('dragover', (e) => {
            e.preventDefault();
            container.style.border = '2px dashed rgba(102,126,234,0.5)';
        });
        container.addEventListener('dragleave', (e) => {
            e.preventDefault();
            container.style.border = 'none';
        });
        container.addEventListener('drop', (e) => {
            e.preventDefault();
            container.style.border = 'none';
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                const file = files[0];
                const name = file.name.replace(/\.[^.]+$/, '');
                const existing = state.maps.find(m => m.name === name);
                if (existing) {
                    if (!confirm(`已存在地图 "${name}"，是否覆盖？`)) return;
                    localStorage.removeItem(storageKey(existing.id));
                    localStorage.removeItem(labelCustomizedKey(existing.id));
                    localStorage.removeItem(hiddenTypesKey(existing.id));
                    state.maps = state.maps.filter(m => m.id !== existing.id);
                }
                addNewMap(file);
            }
        });

        // ---- 标记列表面板切换按钮 ----
        listToggleBtn.addEventListener('click', () => {
            const isCollapsed = markerListPanel.classList.toggle('collapsed');
            listToggleBtn.textContent = isCollapsed ? '▶' : '◀';
            listToggleBtn.title = isCollapsed ? '展开 (PgUp)' : '收起 (PgDn)';
        });

        // ---- 窗口自适应 ----
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.mapLoaded) {
                    const rect = container.getBoundingClientRect();
                    const margin = 200;
                    state.translateX = clamp(state.translateX, -state.mapWidth * state.scale + margin, rect.width -
                    margin);
                    state.translateY = clamp(state.translateY, -state.mapHeight * state.scale + margin, rect.height -
                        margin);
                    updateTransform();
                    renderMarkers();
                }
            }, 200);
        });

        // ============================================================
        //  🚀 启动！
        // ============================================================

        state.showLabels = true;
        console.log('🗺️ 白银之城标记工具');
        console.log('✨ 优化: 鼠标悬停显示标签 | 右侧标记列表 (PgUp/PgDn)');
        console.log('📌 点击列表项可隐藏/显示对应类型标记');

        loadAllMapsData().then(savedMaps => {
            if (savedMaps && savedMaps.length > 0) {
                console.log('📂 找到已保存的地图数据:', savedMaps.length, '张');
                state.maps = savedMaps;
                updateMapSelector();
                const firstMap = state.maps[0];
                if (firstMap) {
                    if (firstMap.dataURL && (firstMap.dataURL.startsWith('http://') || firstMap.dataURL.startsWith('https://'))) {
                        loadMapFromUrl(firstMap.dataURL, firstMap.id, firstMap.name, firstMap.width, firstMap.height);
                    } else {
                        loadMapFromData(firstMap.dataURL, firstMap.id, firstMap.name, firstMap.width, firstMap.height);
                    }
                }
                loading.classList.add('hidden');
            } else {
                console.log('📂 没有已保存的地图，从仓库加载...');
                initFromRepo();
            }
        });
    </script>
</body>
</html>
